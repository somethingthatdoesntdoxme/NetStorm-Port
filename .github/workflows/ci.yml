name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button on the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows, so every step can use the same error reporting
    steps:
      - uses: actions/checkout@v5

      # Runs a command; if it fails, its first error lines become annotations on the
      # run page (so failures can be read without opening the full log).
      - name: Error reporting helper
        run: |
          cat > "$RUNNER_TEMP/step.sh" <<'EOF'
          #!/usr/bin/env bash
          log="$RUNNER_TEMP/step.log"
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            hits=$(grep -iE "error|fatal|cannot|undefined|unresolved|failed" "$log" | grep -v "^--" | head -25)
            [ -z "$hits" ] && hits=$(tail -25 "$log")
            echo "$hits" | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error::${line:0:900}"
            done
            { echo "### Failed: $*"; echo '```'; echo "$hits"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
          EOF
          chmod +x "$RUNNER_TEMP/step.sh"

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: $RUNNER_TEMP/step.sh bash -c "sudo apt-get update && sudo apt-get install -y libsdl2-dev"

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        run: $RUNNER_TEMP/step.sh "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sdl2:x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: $RUNNER_TEMP/step.sh cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          root=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")
          $RUNNER_TEMP/step.sh cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$root/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: $RUNNER_TEMP/step.sh cmake --build build --config Release --parallel

      # Game data can't be shipped, so CI runs the data-free tests; the
      # data-driven suites (tools/test/run_all.sh) run on a machine with an install.
      - name: Unit tests
        run: $RUNNER_TEMP/step.sh ctest --test-dir build -C Release --output-on-failure

      - name: Missing-data smoke test (must fail cleanly, not crash)
        if: runner.os == 'Linux'
        run: |
          set +e
          SDL_VIDEODRIVER=offscreen ./build/netstorm --data /nonexistent --screenshot /tmp/x.bmp
          code=$?
          echo "exit code $code"
          test $code -eq 1

      - name: Relay server starts (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/netstorm-relay --port 27999 > relay.log 2>&1 &
          sleep 1
          grep -q "listening" relay.log && kill %1

      # ---- Downloadable builds (Actions tab -> a run -> Artifacts) ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          d=dist/NetStorm-Port
          mkdir -p "$d"
          cp build/Release/netstorm.exe build/Release/netstorm-relay.exe "$d/"
          cp build/Release/*.dll "$d/" 2>/dev/null || true
          [ -f "$d/SDL2.dll" ] || cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" "$d/"
          cp README.md "$d/"
          printf '%s\r\n' "NetStorm Port - Windows" "" \
            "1. Copy this folder anywhere (or into your NetStorm folder)." \
            "2. Run netstorm.exe. If it can't find NetStorm's data it asks you to drag your NetStorm folder onto its window." \
            "3. netstorm-relay.exe is the optional internet relay server (see README)." > "$d/HOW-TO-PLAY.txt"
          ls -la "$d"

      - name: Package (Linux / Steam Deck)
        if: runner.os == 'Linux'
        run: |
          d=dist/NetStorm-Port
          mkdir -p "$d"
          cp build/netstorm build/netstorm-relay README.md "$d/"
          cat > "$d/netstorm.sh" <<'EOS'
          #!/bin/sh
          # Runs NetStorm Port from wherever this folder is. Needs SDL2 (on SteamOS it's already there;
          # on Debian/Ubuntu: sudo apt install libsdl2-2.0-0).
          cd "$(dirname "$0")" && exec ./netstorm "$@"
          EOS
          chmod +x "$d/netstorm.sh" "$d/netstorm" "$d/netstorm-relay"
          printf '%s\n' "NetStorm Port - Linux / Steam Deck" "" \
            "Run ./netstorm.sh (on Steam Deck: add it to Steam as a non-Steam game to play in Game Mode)." \
            "If it can't find NetStorm's data it asks you to drag your NetStorm folder onto its window," \
            "or run: ./netstorm.sh --data /path/to/Netstorm" > "$d/HOW-TO-PLAY.txt"
          tar -C dist -czf NetStorm-Port-linux.tar.gz NetStorm-Port
          ls -la dist/NetStorm-Port NetStorm-Port-linux.tar.gz

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NetStorm-Port-windows
          path: dist/NetStorm-Port

      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NetStorm-Port-linux
          path: NetStorm-Port-linux.tar.gz
